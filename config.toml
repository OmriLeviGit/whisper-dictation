# Whisper Dictation Configuration

[audio]
# Sample rate in Hz (16000 is optimal for Whisper)
sample_rate = 16000
# Number of audio channels (1 = mono)
channels = 1

[whisper]
# Whisper service port
port = 58432
# Whisper model to use (large-v3, medium, small, etc.)
model = "large-v3"
# Device to run on (cuda for GPU, cpu for CPU)
device = "cuda"
# Compute type (float16 for GPU, int8 for CPU)
compute_type = "float16"
# Request timeout in seconds
timeout = 300
# Maximum retries for failed requests
max_retries = 3
# Delay between retries in seconds
retry_delay = 2

[typing]
# Delay between characters when typing (seconds)
char_delay = 0.03
# Initial delay before starting to type (seconds)
initial_delay = 0.3

[paths]
# Temporary directory for recordings (uses system temp if empty)
temp_dir = ""
# Model cache directory in Docker
model_cache = "/models"
