services:
  whisper-dictation:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: whisper-dictation:latest
    container_name: whisper-dictation-service
    env_file:
      - ../config/service.env
    ports:
      - "${WHISPER_PORT}:${WHISPER_PORT}"
    volumes:
      - whisper-dictation-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WHISPER_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    shm_size: '2gb'

volumes:
  whisper-dictation-models:
    driver: local
